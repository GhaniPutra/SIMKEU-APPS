name: simkeu
description: "SIMKEU - Aplikasi POS untuk Pegawai"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # HTTP & API
  http: ^1.2.2

  # State Management
  provider: ^6.1.2

  # Local Storage (token)
  shared_preferences: ^2.3.2

  # Format Tanggal & Rupiah
  intl: ^0.19.0

  # Chart untuk dashboard
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
